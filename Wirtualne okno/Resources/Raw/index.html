<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(0, 20, 10);
        scene.add(dirLight);

        // ==========================================
        // 1. LEWITUJĄCA RAMKA (Podniesiona i pomniejszona)
        // ==========================================
        const frameGroup = new THREE.Group();
        // Podniesienie całej ramki w osi Y (było 0, jest 1.5)
        frameGroup.position.set(0, 1.5, -15);

        const frameMaterial = new THREE.MeshLambertMaterial({ color: 0x888888 });

        // Zmniejszone wymiary
        const fw = 8.0;  // szerokość (było 10)
        const fh = 5.5;  // wysokość (było 8)
        const ft = 0.4;  // grubość (było 0.5)

        const topF = new THREE.Mesh(new THREE.BoxGeometry(fw + ft * 2, ft, ft), frameMaterial);
        topF.position.set(0, fh / 2 + ft / 2, 0);
        frameGroup.add(topF);

        const botF = new THREE.Mesh(new THREE.BoxGeometry(fw + ft * 2, ft, ft), frameMaterial);
        botF.position.set(0, -fh / 2 - ft / 2, 0);
        frameGroup.add(botF);

        const leftF = new THREE.Mesh(new THREE.BoxGeometry(ft, fh, ft), frameMaterial);
        leftF.position.set(-fw / 2 - ft / 2, 0, 0);
        frameGroup.add(leftF);

        const rightF = new THREE.Mesh(new THREE.BoxGeometry(ft, fh, ft), frameMaterial);
        rightF.position.set(fw / 2 + ft / 2, 0, 0);
        frameGroup.add(rightF);

        scene.add(frameGroup);

        // ==========================================
        // 2. MIASTO W TLE
        // ==========================================
        const cityGroup = new THREE.Group();
        cityGroup.position.set(0, -2, -25);

        const objectMaterial = new THREE.MeshLambertMaterial({ color: 0x228B22 });
        for (let i = 0; i < 40; i++) {
            const w = 1 + Math.random() * 2;
            const h = 2 + Math.random() * 8;
            const d = 1 + Math.random() * 2;
            const cube = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), objectMaterial);

            cube.position.x = (Math.random() - 0.5) * 30;
            cube.position.y = h / 2 - 2;
            cube.position.z = -Math.random() * 20;
            cityGroup.add(cube);
        }

        const plane = new THREE.Mesh(
            new THREE.PlaneGeometry(60, 60),
            new THREE.MeshLambertMaterial({ color: 0x8B4513 })
        );
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -2;
        plane.position.z = -10;
        cityGroup.add(plane);

        scene.add(cityGroup);

        // ==========================================
        // 3. STEROWANIE KAMERĄ
        // ==========================================
        window.updateCameraPosition = function (x, y, z) {
            camera.position.x = x * 10;
            camera.position.y = -y * 8;
            camera.position.z = (z - 2.5) * 2;

            camera.lookAt(camera.position.x, camera.position.y, -100);
        };

        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
